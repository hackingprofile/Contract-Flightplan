openapi: 3.1.0
info:
  title: Widgets API
  version: "1.0.0"
paths:
  /widgets:
    post:
      operationId: createWidget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Widget"
      responses:
        "200":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
components:
  schemas:
    Widget:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
        status:
          type: ["string", "null"]
