openapi: 3.0.3
info:
  title: Pages API
  version: "1.1.0"
paths:
  /pages:
    post:
      operationId: listPages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
components:
  schemas:
    Item:
      type: object
      additionalProperties: false
      required: [data, cursor]
      properties:
        data:
          type: array
          items:
            type: string
        cursor:
          type: string