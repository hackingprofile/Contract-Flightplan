openapi: 3.0.3
info:
  title: Pages API
  version: "1.0.0"
paths:
  /pages:
    post:
      operationId: listPages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
components:
  schemas:
    Item:
      type: object
      additionalProperties: true
      required: [results, next]
      properties:
        results:
          type: array
          items:
            type: string
        next:
          type: string