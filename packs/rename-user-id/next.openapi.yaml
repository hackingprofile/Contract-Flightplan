openapi: 3.0.3
info:
  title: Users API
  version: "1.1.0"
paths:
  /users:
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "200":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
components:
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [user_id, name]
      properties:
        user_id:
          type: string
        name:
          type: string
