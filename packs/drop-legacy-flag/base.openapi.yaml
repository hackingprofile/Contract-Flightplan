openapi: 3.0.3
info:
  title: Flags API
  version: "1.0.0"
paths:
  /flags:
    post:
      operationId: createFlag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
components:
  schemas:
    Item:
      type: object
      additionalProperties: true
      required: [id, name, legacy]
      properties:
        id:
          type: string
        name:
          type: string
        legacy:
          type: boolean