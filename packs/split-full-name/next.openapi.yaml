openapi: 3.0.3
info:
  title: Names API
  version: "1.1.0"
paths:
  /names:
    post:
      operationId: createName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
components:
  schemas:
    Item:
      type: object
      additionalProperties: false
      required: [first_name, last_name]
      properties:
        first_name:
          type: string
        last_name:
          type: string