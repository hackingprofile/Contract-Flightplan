openapi: 3.0.3
info:
  title: Names API
  version: "1.0.0"
paths:
  /names:
    post:
      operationId: createName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
components:
  schemas:
    Item:
      type: object
      additionalProperties: true
      required: [full_name]
      properties:
        full_name:
          type: string