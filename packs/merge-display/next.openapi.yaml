openapi: 3.0.3
info:
  title: People API
  version: "1.1.0"
paths:
  /people:
    post:
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Item"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
components:
  schemas:
    Item:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string