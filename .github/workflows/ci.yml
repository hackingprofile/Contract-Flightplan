name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2 # 2025-04-29
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Shipped packs round-trip
        shell: bash
        run: |
          set -euo pipefail
          for pack in packs/*/; do
            [ -f "$pack/approval.migration.json" ] || continue
            target/release/cfp verify \
              --migration "$pack/approval.migration.json" \
              --proposal "$pack/proposal.json" \
              --source "$pack/base.openapi.yaml" \
              --destination "$pack/next.openapi.yaml" \
              --fixtures "$pack/fixtures" \
              --out "ci-out/$(basename "$pack").verify.json"
          done
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install the locked web toolchain
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Static web check (TypeScript, no emit)
        working-directory: web
        run: npm test
